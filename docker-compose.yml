version: "3.9"

# Vietnamese History GraphRAG — Local Development
# Chạy: docker compose up --build
# Hoặc không dùng Docker, chạy từng service bằng uvicorn (xem README)

services:

  graphrag-service:
    build:
      context: .
      dockerfile: services/graphrag-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./data:/app/data          # share data folder
      - ./src:/app/src
    restart: unless-stopped

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    restart: unless-stopped

  evaluation-service:
    build:
      context: .
      dockerfile: services/evaluation-service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    restart: unless-stopped