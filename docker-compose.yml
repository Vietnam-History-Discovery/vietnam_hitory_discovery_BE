version: '3.8'

services:

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TIMELINE_MODEL=${TIMELINE_MODEL:-openai/gpt-oss-120b}
      - TIMELINE_ANSWER_MODEL=${TIMELINE_ANSWER_MODEL:-llama-3.3-70b-versatile}

    volumes:
      - ./data:/app/data # mount data folder cho embeddings cache
    restart: unless-stopped

  user-service:
    build: ./services/user-service
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    volumes:
      - ./firebase.json:/app/firebase.json:ro
    restart: unless-stopped

  chat-service:
    build: ./services/chat-service
    ports:
      - "${CHAT_SERVICE_PORT:-8082}:8082"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
    volumes:
      - ./firebase.json:/app/firebase.json:ro
    restart: unless-stopped

  article-service:
    build: ./services/article-service
    ports:
      - "${ARTICLE_SERVICE_PORT:-8083}:8083"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    volumes:
      - ./firebase.json:/app/firebase.json:ro
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      - user-service
      - chat-service
      - ai-service
      - article-service
    volumes:
      - ./firebase.json:/app/firebase.json:ro
    restart: unless-stopped
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - ARTICLE_SERVICE_URL=${ARTICLE_SERVICE_URL}

  frontend:
    build:
      context: ../vietnam_hitory_discovery_FE
      dockerfile: Dockerfile
      args:
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
    ports:
      - "3000:80"
    environment:
      - API_GATEWAY_URL=http://api-gateway:8080
    depends_on:
      - api-gateway
    restart: unless-stopped
